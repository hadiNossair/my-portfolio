<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>36 - Interactive Lore Timeline</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --magic-void: #0B0514; 
            --magic-cyan: #00F0FF; 
            --magic-gold: #FFD700;
            --text-pure: #FFFFFF;
            --text-dim: #A78BFA; 
            --font-magic: 'Cinzel', serif;
            --font-ui: 'Inter', sans-serif;
            --glow-cyan: 0 0 20px rgba(0, 240, 255, 0.6);
            --blur-heavy: blur(60px);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { background-color: #000; display: flex; justify-content: center; font-family: var(--font-ui); color: var(--text-pure);  width: 100vw; height: 100vh; margin: 0; }

        .figma-frame {
            width: 100vw;
            min-height: 100vh;
            background-color: var(--magic-void);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .bg-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1440');
            background-size: cover; background-position: center;
            opacity: 0.2; z-index: 0;
         animation: slowBreath 30s infinite alternate ease-in-out; }

        @keyframes slowBreath { 0% { transform: scale(1); filter: contrast(1.2) brightness(0.8); } 100% { transform: scale(1.05); filter: contrast(1.4) brightness(0.6); } }

        .timeline-container {
            position: relative; z-index: 20; width: 1200px;
            height: 800px; display: flex; flex-direction: column;
        }

        .header { text-align: center; margin-bottom: 64px; }
        .header h1 { font-family: var(--font-magic); font-size: 48px; text-shadow: var(--glow-cyan); margin-bottom: 8px; }

        .timeline-track {
            position: absolute; top: 50%; left: 0; width: 100%; height: 4px;
            background: rgba(255,255,255,0.1); border-radius: 2px;
            transform: translateY(-50%);
        }

        .timeline-fill {
            height: 100%; width: 60%; background: var(--magic-cyan);
            box-shadow: var(--glow-cyan); position: relative;
        }

        .timeline-node {
            position: absolute; top: 50%; transform: translate(-50%, -50%);
            width: 24px; height: 24px; border-radius: 50%;
            background: #000; border: 4px solid var(--magic-cyan);
            cursor: pointer; transition: 0.3s;
        }

        .timeline-node:hover, .timeline-node.active {
            background: var(--magic-cyan); box-shadow: var(--glow-cyan); transform: translate(-50%, -50%) scale(1.5);
        }

        .node-1 { left: 20%; }
        .node-2 { left: 40%; }
        .node-3 { left: 60%; }
        .node-4 { left: 80%; border-color: rgba(255,255,255,0.2); }

        .info-card {
            position: absolute; top: 20%; left: 50%; transform: translateX(-50%);
            background: rgba(11, 5, 20, 0.9); border: 1px solid var(--magic-cyan);
            padding: 32px; border-radius: 24px; width: 400px;
            backdrop-filter: var(--blur-heavy); box-shadow: var(--glow-cyan);
            text-align: center;
        }

        .info-date { font-family: var(--font-magic); color: var(--magic-gold); font-size: 24px; margin-bottom: 8px; }
        .info-title { font-size: 20px; font-weight: 700; margin-bottom: 16px; }
        .info-desc { font-size: 14px; color: var(--text-dim); line-height: 1.6; }

    </style>
</head>
<body>
    <main class="figma-frame">
        <div class="bg-layer"></div>
        
        <div class="timeline-container">
            <div class="header">
                <h1>Cosmere Timeline</h1>
                <p style="color: var(--text-dim);">Navigate the major events of the universe</p>
            </div>

            <div style="position: relative; height: 100%; width: 100%;">
                <div class="timeline-track">
                    <div class="timeline-fill"></div>
                </div>

                <div class="timeline-node node-1"></div>
                <div class="timeline-node node-2"></div>
                <div class="timeline-node node-3 active"></div>
                <div class="timeline-node node-4"></div>

                <div class="info-card">
                    <div class="info-date">Era 2: Year 341</div>
                    <div class="info-title">The True Desolation Begins</div>
                    <div class="info-desc">The Everstorm is summoned, restoring the forms of power to the singers and initiating the True Desolation across Roshar. The Knights Radiant are officially refounded.</div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
