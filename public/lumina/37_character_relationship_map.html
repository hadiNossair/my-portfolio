<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>37 - Character Relationship Map</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --magic-void: #0B0514; 
            --magic-cyan: #00F0FF; 
            --magic-pink: #FF69B4;
            --text-pure: #FFFFFF;
            --font-magic: 'Cinzel', serif;
            --font-ui: 'Inter', sans-serif;
            --blur-heavy: blur(60px);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { background-color: #000; display: flex; justify-content: center; font-family: var(--font-ui); color: var(--text-pure);  width: 100vw; height: 100vh; margin: 0; }

        .figma-frame {
            width: 100vw;
            min-height: 100vh;
            background-color: var(--magic-void);
            position: relative;
            display: flex;
            overflow: hidden;
        }

        .bg-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, rgba(0,240,255,0.1) 0%, transparent 70%);
            z-index: 0;
         animation: slowBreath 30s infinite alternate ease-in-out; }

        @keyframes slowBreath { 0% { transform: scale(1); filter: contrast(1.2) brightness(0.8); } 100% { transform: scale(1.05); filter: contrast(1.4) brightness(0.6); } }

        .node-map {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10;
        }

        /* SVG Lines connecting nodes */
        .connection-line { stroke: rgba(0,240,255,0.3); stroke-width: 2; border-style: dashed; }
        .connection-love { stroke: rgba(255,105,180,0.5); stroke-width: 3; }

        .node {
            position: absolute;
            display: flex; flex-direction: column; align-items: center; gap: 8px;
            cursor: pointer; transition: transform 0.3s;
        }
        .node:hover { transform: scale(1.1); z-index: 20; }

        .node-avatar {
            width: 80px; height: 80px; border-radius: 50%;
            background-size: cover; background-position: center;
            border: 3px solid var(--magic-cyan); box-shadow: 0 0 20px rgba(0,240,255,0.4);
        }

        .node-name { font-family: var(--font-magic); font-size: 16px; background: rgba(0,0,0,0.8); padding: 4px 12px; border-radius: 100px; }

        /* Fake Positions */
        .n-kaladin { top: 30%; left: 40%; }
        .n-shallan { top: 40%; left: 60%; }
        .n-adolin { top: 60%; left: 55%; border-color: var(--magic-pink); }
        .n-dalinar { top: 70%; left: 35%; }
        .n-syl { top: 20%; left: 25%; }

        /* Overlay UI */
        .header { position: absolute; top: 64px; left: 64px; z-index: 50; }
        .header h1 { font-family: var(--font-magic); font-size: 40px; }

        .legend { position: absolute; bottom: 64px; right: 64px; background: rgba(0,0,0,0.8); padding: 24px; border: 1px solid rgba(255,255,255,0.2); border-radius: 16px; z-index: 50; }

    </style>
</head>
<body>
    <main class="figma-frame">
        <div class="bg-layer"></div>
        
        <div class="header">
            <h1>Entity Neural Web</h1>
            <p style="color: #A78BFA;">Visualizing relationships in The Stormlight Archive</p>
        </div>

        <svg class="node-map">
            <line x1="40%" y1="30%" x2="60%" y2="40%" class="connection-line"/>
            <line x1="60%" y1="40%" x2="55%" y2="60%" class="connection-love"/>
            <line x1="40%" y1="30%" x2="25%" y2="20%" class="connection-line"/>
            <line x1="40%" y1="30%" x2="35%" y2="70%" class="connection-line"/>
            <line x1="55%" y1="60%" x2="35%" y2="70%" class="connection-line"/>
        </svg>

        <div class="node n-kaladin">
            <div class="node-avatar" style="background-image: url('https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?q=80&w=100');"></div>
            <div class="node-name">Kaladin</div>
        </div>

        <div class="node n-shallan">
            <div class="node-avatar" style="background-image: url('https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=100'); border-color: var(--magic-pink);"></div>
            <div class="node-name">Shallan</div>
        </div>

        <div class="node n-adolin">
            <div class="node-avatar" style="background-image: url('https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?q=80&w=100'); border-color: var(--magic-pink);"></div>
            <div class="node-name">Adolin</div>
        </div>

        <div class="node n-dalinar">
            <div class="node-avatar" style="background-image: url('https://images.unsplash.com/photo-1517841905240-472988babdf9?q=80&w=100');"></div>
            <div class="node-name">Dalinar</div>
        </div>

        <div class="node n-syl">
            <div class="node-avatar" style="background-image: url('https://images.unsplash.com/photo-1618519764620-7403abdbdfe9?q=80&w=100'); border-color: #8B5CF6;"></div>
            <div class="node-name">Syl</div>
        </div>

        <div class="legend">
            <div style="margin-bottom: 8px;"><span style="color: var(--magic-cyan);">—</span> Bonded / Ally</div>
            <div><span style="color: var(--magic-pink);">━</span> Romantic</div>
        </div>
    </main>
</body>
</html>
