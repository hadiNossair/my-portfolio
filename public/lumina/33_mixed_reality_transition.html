<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUMINA | Shifting Reality</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --void: #020205;
            --cyan: #00F0FF;
            --purple: #8B5CF6;
            --font-display: 'Cinzel', serif;
            --font-sans: 'Plus Jakarta Sans', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--void);
            color: #FFF;
            font-family: var(--font-sans);
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bridge-bg {
            position: fixed; inset: 0;
            background: linear-gradient(135deg, #05050A 0%, #1A0B2E 100%);
            z-index: 1;
        }

        /* --- TUNNEL EFFECT --- */
        .portal-tunnel {
            position: relative; z-index: 10;
            width: 100%; height: 100%;
            perspective: 1000px;
            display: flex; align-items: center; justify-content: center;
        }

        .ring {
            position: absolute; width: 300px; height: 300px;
            border: 1px solid var(--cyan); border-radius: 50%;
            opacity: 0; animation: ringFlow 3s infinite linear;
            box-shadow: 0 0 30px var(--cyan);
        }
        .ring:nth-child(2) { animation-delay: 1s; border-color: var(--purple); box-shadow: 0 0 30px var(--purple); }
        .ring:nth-child(3) { animation-delay: 2s; }

        @keyframes ringFlow {
            0% { transform: translateZ(-1000px); opacity: 0; width: 300px; height: 300px; }
            50% { opacity: 0.5; }
            100% { transform: translateZ(500px); opacity: 0; width: 1200px; height: 1200px; }
        }

        .loading-content {
            position: relative; z-index: 100; text-align: center;
        }

        .shimmer-text {
            font-family: var(--font-display); font-size: 32px; letter-spacing: 8px;
            background: linear-gradient(90deg, #FFF, var(--cyan), #FFF);
            background-size: 200%; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: shimmer 3s infinite linear;
        }
        @keyframes shimmer { 0% { background-position: -200%; } 100% { background-position: 200%; } }

        .progress-indicator {
            margin-top: 48px; width: 240px; height: 1px;
            background: rgba(255,255,255,0.1); margin-left: auto; margin-right: auto;
            position: relative; overflow: hidden;
        }
        .progress-flow {
            position: absolute; inset: 0; width: 50%;
            background: var(--cyan); box-shadow: 0 0 15px var(--cyan);
            animation: progressFlow 2s infinite ease-in-out;
        }
        @keyframes progressFlow { from { left: -50%; } to { left: 100%; } }

    </style>
</head>
<body>
    
    <div class="bridge-bg"></div>

    <div class="portal-tunnel">
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
        
        <div class="loading-content">
            <h1 class="shimmer-text">RECALIBRATING REALITY</h1>
            <div class="progress-indicator">
                <div class="progress-flow"></div>
            </div>
            <p style="margin-top: 24px; font-size: 10px; letter-spacing: 4px; color: rgba(255,255,255,0.4); text-transform: uppercase;">Syncing Dimensional Core...</p>
        </div>
    </div>

    <script>
        // Automatic redirection simulating a bridge transition
        const urlParams = new URLSearchParams(window.location.search);
        const target = urlParams.get('to') || '06_magical_home.html';
        
        setTimeout(() => {
            document.body.style.opacity = '0';
            document.body.style.transition = 'opacity 1s ease-in-out';
            setTimeout(() => {
                window.location.href = target;
            }, 1000);
        }, 3000);
    </script>
</body>
</html>
