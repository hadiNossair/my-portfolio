<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>18 - Payment Success</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --magic-void: #0B0514; 
            --magic-cyan: #00F0FF; 
            --magic-gold: #FFD700;
            --text-pure: #FFFFFF;
            --font-magic: 'Cinzel', serif;
            --font-ui: 'Inter', sans-serif;
            --glow-gold: 0 0 60px rgba(255, 215, 0, 0.6);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { background-color: #000; display: flex; justify-content: center; font-family: var(--font-ui); color: var(--text-pure);  width: 100vw; height: 100vh; margin: 0; }

        .figma-frame {
            width: 100vw;
            min-height: 100vh;
            background-color: var(--magic-void);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-direction: column;
            text-align: center;
        }

        .bg-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=1440');
            background-size: cover;
            background-position: center;
            opacity: 0.2;
            z-index: 0;
            mix-blend-mode: screen;
         animation: slowBreath 30s infinite alternate ease-in-out; }

        @keyframes slowBreath { 0% { transform: scale(1); filter: contrast(1.2) brightness(0.8); } 100% { transform: scale(1.05); filter: contrast(1.4) brightness(0.6); } }

        .success-icon {
            position: relative; z-index: 20;
            width: 120px; height: 120px; border-radius: 50%;
            background: rgba(255, 215, 0, 0.1); border: 2px solid var(--magic-gold);
            display: flex; align-items: center; justify-content: center;
            font-size: 48px; box-shadow: var(--glow-gold); margin-bottom: 40px;
        }

        .title { position: relative; z-index: 20; font-family: var(--font-magic); font-size: 64px; color: var(--magic-gold); text-shadow: var(--glow-gold); margin-bottom: 16px; }
        .subtitle { position: relative; z-index: 20; font-size: 24px; color: #D1D5DB; margin-bottom: 48px; }

        .magic-btn-solid {
            position: relative; z-index: 20; padding: 20px 64px;
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.8), rgba(184, 134, 11, 0.8));
            color: #000; border: 1px solid var(--magic-gold); border-radius: 100px;
            font-family: var(--font-magic); font-size: 20px; font-weight: 700; cursor: pointer; box-shadow: var(--glow-gold);
        }

    </style>
</head>
<body>
    <main class="figma-frame">
        <div class="bg-layer"></div>
        
        <div class="success-icon">✨</div>
        <h1 class="title">Pact Sealed</h1>
        <p class="subtitle">Your artifacts have been safely transported to your Grimoire.</p>
        
        <button class="magic-btn-solid">Enter Your Grimoire</button>
    </main>
</body>
</html>
