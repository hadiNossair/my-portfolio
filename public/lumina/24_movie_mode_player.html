<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUMINA | The Cinema Oracle</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --void: #020205;
            --cyan: #00F0FF;
            --purple: #8B5CF6;
            --font-display: 'Cinzel', serif;
            --font-sans: 'Plus Jakarta Sans', sans-serif;
            --glass: blur(40px);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--void);
            color: #FFF;
            font-family: var(--font-sans);
            height: 100vh;
            overflow: hidden;
            display: flex; flex-direction: column;
        }

        /* --- CINEMATIC PLAYER --- */
        .player-canvas {
            flex: 1; position: relative; background: #000;
            display: flex; align-items: center; justify-content: center;
        }
        .movie-placeholder {
            width: 100%; height: 100%;
            background: url('https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=2000') center/cover;
            filter: brightness(0.6);
        }

        .player-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 30%),
                        linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, transparent 30%);
            z-index: 10;
        }

        /* --- CONTROLS --- */
        .controls {
            position: absolute; bottom: 0; width: 100%;
            padding: 40px 64px; z-index: 100;
        }

        .prog-track { width: 100%; height: 4px; background: rgba(255,255,255,0.1); border-radius: 10px; margin-bottom: 32px; position: relative; }
        .prog-fill { position: absolute; left: 0; top: 0; height: 100%; width: 35%; background: var(--cyan); box-shadow: 0 0 15px var(--cyan); }

        .ctrl-row { display: flex; justify-content: space-between; align-items: center; }
        .play-btn { width: 64px; height: 64px; border-radius: 50%; background: #FFF; color: #000; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; transition: 0.3s; }
        .play-btn:hover { transform: scale(1.1); box-shadow: 0 0 30px rgba(255,255,255,0.4); }

        .movie-title { font-family: var(--font-display); font-size: 24px; letter-spacing: 2px; }
        .movie-meta { font-size: 12px; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 2px; margin-top: 4px; }

        .exit-btn { position: absolute; top: 40px; left: 64px; z-index: 100; color: #FFF; text-decoration: none; font-weight: 800; font-size: 12px; letter-spacing: 4px; opacity: 0.6; transition: 0.3s; }
        .exit-btn:hover { opacity: 1; transform: translateX(-5px); }

    </style>
</head>
<body>
    
    <main class="player-canvas">
        <a href="23_drama_mode_home.html" class="exit-btn">✕ EXIT THEATER</a>
        <div class="movie-placeholder"></div>
        <div class="player-overlay"></div>

        <div class="controls">
            <div class="prog-track"><div class="prog-fill"></div></div>
            <div class="ctrl-row">
                <div style="display: flex; align-items: center; gap: 32px;">
                    <div class="play-btn">▶</div>
                    <div>
                        <h2 class="movie-title">The Grandfather: Part I</h2>
                        <p class="movie-meta">4K HDR • ATMOS • DRAMA REALM</p>
                    </div>
                </div>
                <div style="display: flex; gap: 32px; font-size: 14px; font-weight: 700;">
                    <span>SUBTITLES: ON</span>
                    <span>1:42:05 / 3:12:00</span>
                    <span>FULLSCREEN</span>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
