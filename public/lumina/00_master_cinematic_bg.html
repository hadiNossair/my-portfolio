<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LUMINA | Masterpiece Cinematic Background System</title>
    <style>
        :root {
            --void: #020205;
            --midnight: #050510;
            --sanctum-blue: #0A0A1F;
            --hogwarts-gold: #D4AF37;
            --fantasy-purple: #2D1B4E;
            --sci-fi-cyan: #00F0FF;
            --dramatic-crimson: #4A0000;
            --ease-cinematic: cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--void);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* --- THE MASTERPIECE BACKGROUND ENGINE --- */
        .cinematic-bg-engine {
            position: fixed;
            inset: 0;
            z-index: -100;
            background: var(--void);
            overflow: hidden;
        }

        /* Layer 1: Base Deep Gradients (HBO Realism) */
        .layer-base {
            position: absolute; inset: 0;
            background: 
                radial-gradient(circle at 20% 30%, var(--sanctum-blue) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, var(--fantasy-purple) 0%, transparent 60%),
                radial-gradient(circle at 50% 50%, var(--midnight) 0%, var(--void) 100%);
            opacity: 0.8;
        }

        /* Layer 2: The Blurred Environment (Library & Castle) */
        .layer-environment {
            position: absolute; inset: -10%;
            background: url('https://images.unsplash.com/photo-1512820790803-83ca734da794?q=80&w=2560') center/cover;
            filter: blur(120px) brightness(0.2) saturate(0.5);
            opacity: 0.5;
            animation: envShift 30s infinite alternate var(--ease-cinematic);
        }
        @keyframes envShift { from { transform: scale(1); rotate(0deg); } to { transform: scale(1.1); rotate(2deg); } }

        /* Layer 3: Mystical Fog & Smoke (Netflix Style) */
        .layer-fog {
            position: absolute; inset: 0;
            background: url('https://www.transparenttextures.com/patterns/carbon-fibre.png'); /* Subtle grain */
            opacity: 0.05;
            mix-blend-mode: overlay;
        }
        .fog-banks {
            position: absolute; inset: 0;
            background: linear-gradient(0deg, rgba(2,2,5,0.8) 0%, transparent 40%, transparent 60%, rgba(2,2,5,0.8) 100%);
            z-index: 5;
        }

        /* Layer 4: Volumetric Light Rays (Disney+ Magic) */
        .light-rays {
            position: absolute; inset: 0;
            background: repeating-linear-gradient(45deg, transparent, transparent 100px, rgba(212, 175, 55, 0.03) 110px, transparent 120px);
            mask-image: radial-gradient(circle at center, black, transparent 80%);
            animation: raysMove 20s infinite linear;
        }
        @keyframes raysMove { from { background-position: 0 0; } to { background-position: 500px 500px; } }

        /* Layer 5: Floating Particles (Golden Embers) */
        .particles-system { position: absolute; inset: 0; z-index: 10; }
        .ember {
            position: absolute; width: 2px; height: 2px;
            background: var(--hogwarts-gold);
            border-radius: 50%;
            filter: blur(1px) drop-shadow(0 0 5px var(--hogwarts-gold));
            animation: floatUp 15s infinite linear;
        }
        @keyframes floatUp {
            from { transform: translateY(110vh) translateX(0) scale(1); opacity: 0; }
            20% { opacity: 0.4; }
            80% { opacity: 0.4; }
            to { transform: translateY(-10vh) translateX(100px) scale(0.5); opacity: 0; }
        }

        /* Layer 6: UI Reflection & Sci-Fi Glow */
        .ui-reflections {
            position: absolute; inset: 0;
            background: 
                radial-gradient(circle at 90% 10%, rgba(0, 240, 255, 0.05) 0%, transparent 30%),
                radial-gradient(circle at 10% 90%, rgba(139, 92, 246, 0.05) 0%, transparent 30%);
            pointer-events: none;
        }

        /* Layer 7: Cinematic Film Grain */
        .film-grain {
            position: absolute; inset: 0;
            background: url('https://grainy-gradients.vercel.app/noise.svg');
            opacity: 0.15;
            pointer-events: none;
            mix-blend-mode: soft-light;
        }

        /* --- DEMO CONTENT --- */
        .demo-overlay {
            position: relative;
            z-index: 100;
            width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #FFF; text-align: center;
            padding: 100px;
        }
        .demo-title { font-family: 'Cinzel', serif; font-size: 80px; letter-spacing: 0.5em; color: var(--hogwarts-gold); text-shadow: 0 0 50px rgba(212, 175, 55, 0.5); margin-bottom: 24px; }
        .demo-p { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 14px; letter-spacing: 5px; text-transform: uppercase; color: rgba(255,255,255,0.4); }

    </style>
</head>
<body>

    <!-- MASTER CINEMATIC ENGINE -->
    <div class="cinematic-bg-engine">
        <div class="layer-base"></div>
        <div class="layer-environment"></div>
        <div class="light-rays"></div>
        <div class="fog-banks"></div>
        <div class="particles-system" id="particles"></div>
        <div class="ui-reflections"></div>
        <div class="film-grain"></div>
    </div>

    <!-- DEMO UI (To show readability) -->
    <div class="demo-overlay">
        <h1 class="demo-title">LUMINA</h1>
        <p class="demo-p">The Masterpiece Background System</p>
    </div>

    <script>
        const pContainer = document.getElementById('particles');
        for(let i = 0; i < 80; i++) {
            const e = document.createElement('div');
            e.className = 'ember';
            e.style.left = Math.random() * 100 + 'vw';
            e.style.top = Math.random() * 100 + 'vh';
            e.style.width = (Math.random() * 3 + 1) + 'px';
            e.style.height = e.style.width;
            e.style.animationDuration = (Math.random() * 10 + 10) + 's';
            e.style.animationDelay = (Math.random() * 10) + 's';
            e.style.opacity = Math.random() * 0.5;
            pContainer.appendChild(e);
        }
    </script>
</body>
</html>
