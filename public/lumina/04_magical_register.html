<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUMINA | Commencing Apprenticeship</title>
    <!-- Fonts - Hogwarts & Cinematic Grade -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@1,900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --void: #020205;
            --hogwarts-gold: #D4AF37;
            --hogwarts-crimson: #740001;
            --surface: rgba(15, 15, 25, 0.6);
            --border: rgba(255, 255, 255, 0.08);
            --font-display: 'Cinzel', serif;
            --font-accent: 'Playfair Display', serif;
            --font-sans: 'Plus Jakarta Sans', sans-serif;
            --glass: blur(50px);
            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* html.to.design Reset */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        body {
            background-color: var(--void);
            color: #FFFFFF;
            font-family: var(--font-sans);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- THE MAGICAL BACKGROUND --- */
        .master-bg {
            position: fixed; inset: 0; z-index: -1;
            background: url('https://images.unsplash.com/photo-1544947950-fa07a98d237f?q=80&w=2560') center/cover;
            filter: brightness(0.15) saturate(1.2) blur(3px);
        }
        .embers-container { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
        .ember { position: absolute; width: 2px; height: 2px; background: var(--hogwarts-gold); border-radius: 50%; opacity: 0.4; animation: float-up 12s infinite linear; }
        @keyframes float-up { from { transform: translateY(110vh) scale(1); opacity: 0; } 50% { opacity: 0.6; } to { transform: translateY(-10vh) scale(0.5); opacity: 0; } }

        /* --- REGISTRATION CARD --- */
        .register-card {
            width: 100%;
            max-width: 600px;
            background: var(--surface);
            backdrop-filter: var(--glass);
            border: 1px solid var(--border);
            border-radius: 48px;
            padding: 70px 60px;
            display: flex;
            flex-direction: column;
            gap: 40px;
            position: relative;
            z-index: 10;
            box-shadow: 0 50px 100px rgba(0,0,0,0.8);
            animation: cardEntrance 1s var(--ease-out-expo);
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-header { text-align: center; }
        .auth-logo { font-family: var(--font-display); font-size: 20px; color: var(--hogwarts-gold); letter-spacing: 0.4em; margin-bottom: 12px; }
        .auth-title { font-family: var(--font-display); font-size: 40px; font-weight: 900; line-height: 1.1; }

        /* --- FORM --- */
        .auth-form { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        .full-width { grid-column: span 2; }

        .input-group { display: flex; flex-direction: column; gap: 10px; }
        .input-label { font-family: var(--font-display); font-size: 10px; letter-spacing: 2px; color: var(--hogwarts-gold); opacity: 0.8; }
        .input-field {
            width: 100%; height: 60px; background: rgba(255,255,255,0.04);
            border: 1px solid var(--border); border-radius: 12px;
            padding: 0 20px; color: #FFF; font-size: 14px;
            transition: 0.4s var(--ease-out-expo);
            outline: none;
        }
        .input-field:focus { border-color: var(--hogwarts-gold); background: rgba(255,255,255,0.08); box-shadow: 0 0 30px rgba(212, 175, 55, 0.15); }

        .btn-magic {
            grid-column: span 2; height: 68px; background: var(--hogwarts-gold);
            color: #000; border: none; border-radius: 12px;
            font-weight: 900; font-size: 13px; text-transform: uppercase;
            letter-spacing: 3px; cursor: pointer; transition: 0.5s;
        }
        .btn-magic:hover { transform: translateY(-4px); box-shadow: 0 20px 40px rgba(212, 175, 55, 0.3); }

        .auth-footer { text-align: center; font-size: 14px; color: rgba(255,255,255,0.4); margin-top: 10px; }
        .auth-link { color: var(--hogwarts-gold); text-decoration: none; font-weight: 800; }

    </style>
</head>
<body>

    <div class="master-bg">
        <div class="embers-container" id="embers"></div>
    </div>

    <!-- MAIN REGISTRATION FRAME -->
    <main class="register-card">
        <header class="auth-header">
            <div class="auth-logo">LUMINA</div>
            <h1 class="auth-title">Begin Your<br>Apprenticeship</h1>
            <p style="color: rgba(255,255,255,0.4); margin-top: 12px; font-size: 14px;">Enlist in the sovereign covenant of seekers.</p>
        </header>

        <form class="auth-form" onsubmit="event.preventDefault(); window.location.href='06_magical_home.html';">
            <div class="input-group">
                <label class="input-label">True Name</label>
                <input type="text" class="input-field" placeholder="Alaric Thorne" required>
            </div>
            <div class="input-group">
                <label class="input-label">Arcane Identity</label>
                <input type="text" class="input-field" placeholder="seeker99" required>
            </div>
            
            <div class="input-group full-width">
                <label class="input-label">Spectral Email</label>
                <input type="email" class="input-field" placeholder="wizard@multiverse.com" required>
            </div>

            <div class="input-group">
                <label class="input-label">Secret Sigil</label>
                <input type="password" class="input-field" placeholder="••••••••" required>
            </div>
            <div class="input-group">
                <label class="input-label">Confirm Sigil</label>
                <input type="password" class="input-field" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-magic">ENLIST IN THE COVEN</button>
        </form>

        <footer class="auth-footer">
            Already a member of the circle? <a href="03_magical_login.html" class="auth-link">Unseal Your Account</a>
        </footer>
    </main>

    <script>
        const eContainer = document.getElementById('embers');
        for(let i = 0; i < 40; i++) {
            const e = document.createElement('div');
            e.className = 'ember';
            e.style.left = Math.random() * 100 + 'vw';
            e.style.animationDelay = Math.random() * 10 + 's';
            eContainer.appendChild(e);
        }
    </script>
</body>
</html>
